<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>José Eduardo | Estudante de Sistemas de Informação</title>
  <meta name="description" content="Portfólio de José Eduardo, estudante de Sistemas de Informação no IFCE. Python, SQL e projetos próprios.">
  <!-- Ícones: Devicon (logos das tecnologias) e Font Awesome (ícones genéricos: Excel, Word, e-mail etc.) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- NAVEGAÇÃO: os links são gerados pelo script.js (lista "nav" em DATA) -->
  <header class="topbar">
    <a class="brand" href="#home" id="brand">Portfólio</a>
    <nav id="nav" aria-label="Seções"></nav>
  </header>

  <main>
    <!-- 1. DASHBOARD / HOME -->
    <section id="home" class="hero">
      <div class="hero-text">
        <h1 id="hero-name"></h1>
        <p class="role" id="hero-role"></p>
        <p class="meta" id="hero-meta"></p>
        <p class="lead" id="hero-desc"></p>
        <div class="chips" id="hero-tech"></div>
        <div class="cta">
          <a class="btn primary" href="#projetos">Ver projetos</a>
          <a class="btn" href="#sobre">Sobre mim</a>
          <a class="btn" id="btn-github" href="#contato" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
      <!-- PLACEHOLDER: FOTO DE PERFIL — defina o arquivo em DATA.avatar (js/script.js). Sem arquivo, aparecem suas iniciais. -->
      <figure class="photo" id="avatar"></figure>
      <!-- PLACEHOLDER: SPRITE POKEMON (home) — arquivo em assets/images/pokemon/sprite-home.png (caminho em DATA.pokemon.sprites). Sem arquivo, não aparece nada. -->
      <div class="sprite" data-slot="home"></div>
    </section>

    <!-- 2. SOBRE -->
    <section id="sobre"><!-- PLACEHOLDER: POKEBOLA — troque em DATA.pokemon.pokeball (js/script.js); o texto ao clicar fica em DATA.pokemon.balls -->
    <h2>Sobre mim<span class="ball-slot" data-ball="about"></span></h2><div class="about glass" id="about"></div></section>
    <!-- 3. HABILIDADES -->
    <section id="habilidades">
      <!-- PLACEHOLDER: SPRITE POKEMON (skills) — coloque o arquivo em assets/images/ e defina o caminho em DATA.pokemon.sprites.skills (js/script.js). Vazio = não aparece nada. -->
    <div class="sprite" data-slot="skills"></div>
      <h2>Tecnologias</h2><p class="sub">O que estudo e uso nos meus projetos.</p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="grid skills" id="skills"></div>
    </section>
    <!-- 4. EXPERIÊNCIA -->
    <section id="experiencia"><h2>Experiência</h2><ol class="timeline" id="timeline"></ol></section>
    <!-- 5. PROJETOS -->
    <section id="projetos"><!-- PLACEHOLDER: SPRITE POKEMON (projects) — coloque o arquivo em assets/images/ e defina o caminho em DATA.pokemon.sprites.projects (js/script.js). Vazio = não aparece nada. -->
    <div class="sprite" data-slot="projects"></div><h2>Projetos<span class="ball-slot" data-ball="projects"></span></h2><p class="sub">Projetos próprios que uso para praticar o que estudo.</p><div class="grid projects" id="projects"></div></section>
    <!-- 6. FORMAÇÃO -->
    <section id="formacao"><h2>Formação e certificações</h2><div class="grid edu" id="education"></div></section>
    <!-- 7. CONTATO -->
    <section id="contato"><!-- PLACEHOLDER: SPRITE POKEMON (contact) — coloque o arquivo em assets/images/ e defina o caminho em DATA.pokemon.sprites.contact (js/script.js). Vazio = não aparece nada. -->
    <div class="sprite" data-slot="contact"></div><h2>Contato</h2><div class="grid contact" id="contact"></div></section>
  </main>

  <footer><span id="footer"></span><span class="ball-slot" data-ball="footer"></span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/script.js"></script>
</body>
</html>
