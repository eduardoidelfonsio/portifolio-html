<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio</title>
  <meta name="description" content="Portfólio de desenvolvedor">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- NAVEGAÇÃO: os links são gerados pelo script.js (lista "nav" em DATA) -->
  <header class="topbar">
    <a class="brand" href="#home" id="brand">Portfólio</a>
    <nav id="nav" aria-label="Seções"></nav>
  </header>

  <main>
    <!-- 1. DASHBOARD / HOME -->
    <section id="home" class="hero">
      <div class="hero-text">
        <h1 id="hero-name"></h1>
        <p class="role" id="hero-role"></p>
        <p class="lead" id="hero-desc"></p>
        <div class="chips" id="hero-tech"></div>
        <div class="cta">
          <a class="btn primary" href="#projetos">Ver projetos</a>
          <a class="btn" href="#contato">Entrar em contato</a>
        </div>
      </div>
      <!-- Cartão de treinador compacto: avatar, level, XP e indicadores -->
      <aside class="trainer glass" aria-label="Resumo">
        <div class="t-top"><div class="avatar" id="avatar"></div>
          <div><div class="t-name" id="t-name"></div><div class="t-level" id="t-level"></div></div></div>
        <div class="xp"><i id="xp-fill"></i></div>
        <dl class="stats" id="stats"></dl>
      </aside>
    </section>

    <!-- 2. SOBRE -->
    <section id="sobre"><h2>Sobre mim</h2><div class="about glass" id="about"></div></section>
    <!-- 3. HABILIDADES -->
    <section id="habilidades">
      <h2>Skills</h2><p class="sub">Tecnologias e ferramentas, por categoria.</p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="grid skills" id="skills"></div>
    </section>
    <!-- 4. EXPERIÊNCIA -->
    <section id="experiencia"><h2>Experiência</h2><ol class="timeline" id="timeline"></ol></section>
    <!-- 5. PROJETOS -->
    <section id="projetos"><h2>Projetos</h2><p class="sub">O que já construí e o que está em andamento.</p><div class="grid projects" id="projects"></div></section>
    <!-- 6. FORMAÇÃO -->
    <section id="formacao"><h2>Formação e certificações</h2><div class="grid edu" id="education"></div></section>
    <!-- 7. CONTATO -->
    <section id="contato"><h2>Contato</h2><div class="grid contact" id="contact"></div></section>
  </main>

  <footer id="footer"></footer>
  <script src="js/script.js"></script>
</body>
</html>
